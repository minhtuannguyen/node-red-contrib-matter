<script type="text/javascript">
  RED.nodes.registerType('matter-read', {
    category:    'matter',
    color:       '#7CBBDE',
    defaults: {
      name:          { value: '' },
      controller:    { value: '', type: 'matter-controller', required: true },
      nodeId:        { value: '' },
      endpointId:    { value: '1', validate: RED.validators.number() },
      clusterId:     { value: '0101' },
      attributeName: { value: '' }
    },
    inputs:  1,
    outputs: 1,
    icon:    'font-awesome/fa-eye',
    label: function () {
      return this.name || (this.attributeName ? `read: ${this.attributeName}` : 'Matter Read');
    },
    paletteLabel: 'read attr'
  });
</script>

<script type="text/html" data-template-name="matter-read">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Matter Read">
  </div>
  <div class="form-row">
    <label for="node-input-controller"><i class="fa fa-cog"></i> Controller</label>
    <input type="text" id="node-input-controller">
  </div>
  <div class="form-row">
    <label for="node-input-nodeId"><i class="fa fa-microchip"></i> Node ID</label>
    <input type="text" id="node-input-nodeId" placeholder="e.g. 1 (decimal)">
  </div>
  <div class="form-row">
    <label for="node-input-endpointId"><i class="fa fa-sitemap"></i> Endpoint</label>
    <input type="number" id="node-input-endpointId" placeholder="1" min="0">
  </div>
  <div class="form-row">
    <label for="node-input-clusterId"><i class="fa fa-cubes"></i> Cluster ID (hex)</label>
    <input type="text" id="node-input-clusterId" placeholder="0101 (DoorLock)">
  </div>
  <div class="form-row">
    <label for="node-input-attributeName"><i class="fa fa-database"></i> Attribute</label>
    <input type="text" id="node-input-attributeName" placeholder="e.g. lockState">
    <div class="form-tips">
      Camel-case attribute name. DoorLock examples: <code>lockState</code>,
      <code>lockType</code>, <code>actuatorEnabled</code>.
      Override via <code>msg.attributeName</code>.
    </div>
  </div>
</script>

<script type="text/html" data-help-name="matter-read">
  <p>Read a cluster attribute from a commissioned Matter device on demand.</p>
  <h3>Input</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">any</span></dt>
    <dd>Triggers the read. The payload value is ignored.</dd>
    <dt class="optional">nodeId / endpointId / clusterId / attributeName</dt>
    <dd>Override the configured values at runtime.</dd>
  </dl>
  <h3>Output</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">any</span></dt>
    <dd>The decoded attribute value fetched live from the device.</dd>
    <dt>topic <span class="property-type">string</span></dt>
    <dd>The attribute name.</dd>
  </dl>
</script>
