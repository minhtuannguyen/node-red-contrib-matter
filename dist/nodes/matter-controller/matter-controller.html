<script type="text/javascript">
  RED.nodes.registerType('matter-controller', {
    category: 'config',
    defaults: {
      name:        { value: '' },
      storagePath: { value: '' },
      port:        { value: '5540', validate: RED.validators.number() },
      logLevel:    { value: 'Info' }
    },
    label: function () {
      return this.name || 'Matter Controller';
    },
    oneditprepare: function () {
      var nodeId = this.id;
      $('#nr-mc-rediscover').on('click', function () {
        var $btn = $(this);
        $btn.prop('disabled', true).text('Rediscovering…');
        $.ajax({ method: 'POST', url: '/matter-nodes/' + nodeId + '/rediscover' })
          .done(function () {
            $btn.text('Done ✓');
            setTimeout(function () { $btn.prop('disabled', false).text('Rediscover all devices'); }, 3000);
          })
          .fail(function (jqXHR) {
            var msg = (jqXHR.responseJSON && jqXHR.responseJSON.error) || jqXHR.statusText;
            $btn.text('Failed: ' + msg);
            setTimeout(function () { $btn.prop('disabled', false).text('Rediscover all devices'); }, 4000);
          });
      });
    }
  });
</script>

<script type="text/html" data-template-name="matter-controller">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="Matter Controller">
  </div>
  <div class="form-row">
    <label for="node-config-input-storagePath">
      <i class="fa fa-folder"></i> Storage Path
    </label>
    <input type="text" id="node-config-input-storagePath"
           placeholder="~/.node-red-matter (default)">
    <div class="form-tips">
      Path where Matter fabric credentials are stored. Must persist across reboots.
      Leave blank to use <code>~/.node-red-matter</code>.
    </div>
  </div>
  <div class="form-row">
    <label for="node-config-input-port"><i class="fa fa-plug"></i> UDP Port</label>
    <input type="number" id="node-config-input-port" placeholder="5540" min="1024" max="65535">
    <div class="form-tips">Matter controller UDP port (default: 5540).</div>
  </div>
  <div class="form-row">
    <label for="node-config-input-logLevel"><i class="fa fa-list"></i> Log Level</label>
    <select id="node-config-input-logLevel">
      <option value="Fatal">Fatal</option>
      <option value="Error">Error</option>
      <option value="Warn">Warn</option>
      <option value="Info" selected>Info</option>
      <option value="Debug">Debug</option>
    </select>
  </div>
  <div class="form-row">
    <label><i class="fa fa-refresh"></i> Rediscover</label>
    <button type="button" id="nr-mc-rediscover" class="red-ui-button">Rediscover all devices</button>
    <div class="form-tips" style="margin-top:4px;">
      Use after moving a HomePod / Thread Border Router. Forces all devices to
      be re-found via mDNS and updates their cached addresses.
    </div>
  </div>
</script>
